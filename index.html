<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<title>衍 &amp; 小嘉</title>
<link rel="stylesheet" href="src/css/base.css">
<link rel="stylesheet" href="src/css/phone.css">
<link rel="stylesheet" href="src/css/views.css">
<link rel="stylesheet" href="src/css/sheet.css">
</head>
<body>

<div class="phone" id="phone">

  <div class="statusbar">
    <div class="brand" id="app-name">Yan</div>
    <div class="sb-right"><span id="sb-time">--:--</span></div>
  </div>

  <div id="stage"></div>

  <div class="tabbar" id="tabbar">
    <button class="tab active" data-tab="chat">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-8.5 8.4 9 9 0 0 1-3.9-.9L3 20.5l1.5-4.6a8.3 8.3 0 0 1-.9-3.9A8.4 8.4 0 0 1 12 3.1a8.4 8.4 0 0 1 9 8.4z"></path></svg>
      <span>聊天</span>
    </button>
    <button class="tab" data-tab="discover">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><polygon points="15.5 8.5 13.5 13.5 8.5 15.5 10.5 10.5"></polygon></svg>
      <span>发现</span>
    </button>
    <button class="tab" data-tab="me">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"></path></svg>
      <span>我的</span>
    </button>
    <button class="tab" data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="17" x2="13" y2="17"></line><circle cx="18" cy="17" r="2"></circle></svg>
      <span>设置</span>
    </button>
  </div>

</div>

<script src="src/js/store.js"></script>
<script src="src/js/views.js"></script>
<script src="src/js/app.js"></script>
</body>
</html>
